; === Kimenő hívások ===

[from-app-1]
exten => _[+0-9].,1,Dial(PJSIP/${EXTEN}@us-1)
 same => n,Hangup()

; === Bejövő hívások ===

[from-upstream]
exten => 92400004,1,Gosub(ring-app,s,1(app1))
 same => n,Hangup()

exten => s,1,Goto(92400004,1)


; === Hívás + push subroutine ===
; CallKit-first architektúra: user fogad → app foreground → SIP register → INVITE.
; Az app már foreground-ban van regisztrációkor, 1mp settle elég.
; Polling: max 45x1mp = 45 mp (telefon kinyitás + CallKit tappintás ideje).

[ring-app]
exten => s,1,NoOp(Bejövő hívás: ${ARG1} <- ${CALLERID(num)})
 same => n,GotoIf($["${PJSIP_AOR(${ARG1},contact)}" != ""]?skipwait)
 same => n,Ringing()
 same => n,System(/opt/sip-push/send_push.py "${CALLERID(name)}" "${CALLERID(num)}" "${ARG1}")
 same => n,Set(WAIT_COUNT=0)
 same => n(waitloop),GotoIf($[${WAIT_COUNT} >= 45]?done)
 same => n,Wait(1)
 same => n,Set(WAIT_COUNT=$[${WAIT_COUNT}+1])
 same => n,GotoIf($["${PJSIP_AOR(${ARG1},contact)}" = ""]?waitloop)
 same => n,Wait(1)
 same => n(skipwait),Set(RETRY_COUNT=0)
 same => n(dial),GotoIf($["${PJSIP_AOR(${ARG1},contact)}" = ""]?done)
 same => n,Dial(PJSIP/${ARG1},30)
 same => n,NoOp(DIALSTATUS=${DIALSTATUS} RETRY=${RETRY_COUNT})
 same => n,GotoIf($["${DIALSTATUS}" != "BUSY"]?done)
 same => n,GotoIf($[${RETRY_COUNT} >= 8]?done)
 same => n,Set(RETRY_COUNT=$[${RETRY_COUNT}+1])
 same => n,Wait(2)
 same => n,Goto(dial)
 same => n(done),Return()
